name: CI-CD
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: usando o codigo do repositorio
        uses: actions/checkout@v6.0.2
      - name: Autenticacao no dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: criando a imagem e subindo no dockerhub
        uses: docker/build-push-action@v5.3.0
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            schinaid/aula-primeira-pipeline:v${{ github.run_number }}
            schinaid/aula-primeira-pipeline:latest
  CD:
    runs-on: ubuntu-latest
    needs: [CI]
    steps:
    - name: obtendo o codigo
      uses: actions/checkout@v6.0.2
    - name: Criando Cluster Kubernetes (Kind)
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: cluster-teste
    - name: Execucao do manifesto no Kind
      run: |
        # Aqui o kubectl ja esta configurado automaticamente para o Kind
        kubectl apply -f ./k8s/deployment.yaml    
    - name: Verificando o deploy
      run: |
        kubectl get pods
        kubectl get deployments
