name: CI-CD
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: usando o codigo do repositorio
        uses: actions/checkout@v6.0.2
      - name: Autenticacao no dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: criando a imagem e subindo no dockerhub
        uses: docker/build-push-action@v5.3.0
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            schinaid/aula-primeira-pipeline:v${{ github.run_number }}
            schinaid/aula-primeira-pipeline:latest
  CD:
    runs-on: ubuntu-latest
    needs: [CI]
    steps:
    - name: obtendo o codigo
      uses: actions/checkout@v6.0.2
    - name: configuracao de contexto do kubeconfig
      uses: azure/k8s-set-context@v4.0.0
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.K8S_CONFIG }}
    - name: Execucao do manifesto
      uses: Azure/k8s-deploy@v5
      with:
        manifests: |
            ./k8s/deployment.yaml
        images: schinaid/aula-primeira-pipeline:v${{ github.run_number }}